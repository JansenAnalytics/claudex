# cargo-audit configuration for matrix-sidecar (read from .cargo/audit.toml).
# Local: `cargo audit`   ·   CI: `cargo audit --deny warnings` (a real gate — a
# NEW advisory fails the build; the one triaged exception below is allowlisted).

[advisories]
# RUSTSEC-2024-0388 — `derivative` is unmaintained (a warning, NOT a vulnerability).
# Pulled ONLY transitively via `matrix-sdk-indexeddb` (the browser/WASM IndexedDB
# crypto store), a feature we do NOT enable — we use the `sqlite` store.
# `cargo tree -i derivative -e normal` confirms it is absent from our compiled
# binary; it appears only in Cargo.lock as an unused optional dependency.
# Re-evaluate if we ever enable the `indexeddb` feature or matrix-sdk drops it.
ignore = ["RUSTSEC-2024-0388"]
