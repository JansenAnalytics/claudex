[package]
name = "matrix-sidecar"
version = "0.1.0"
edition = "2021"
description = "E2EE Matrix transport for the Claudex Matrix channel. Owns all cryptography, persistence, cross-signing, and verified-only delivery (matrix-rust-sdk / vodozemac). Exposes a localhost-only HTTP API the Python bridge drives."
license = "MIT"
publish = false

# ── Dependency policy ────────────────────────────────────────────────────────
# Security-critical: the only Matrix/crypto dependency is Element's matrix-sdk
# (audited vodozemac). Pin EXACT versions and commit Cargo.lock; run `cargo audit`
# and `cargo deny` in CI. The versions below are a starting point — on first build,
# `cargo update` to the latest releases, confirm the feature names still exist
# (notably the verified-only key-sharing strategy in matrix.rs), then commit the lock.
[dependencies]
# default-features = false deliberately omits `automatic-room-key-forwarding`:
# verified-only delivery must not auto-forward room keys on request. 0.17 has no
# rustls-tls feature (the async client/TLS is built in). bundled-sqlite compiles
# SQLite in so no system libsqlite3 is needed.
matrix-sdk = { version = "0.17", default-features = false, features = [
    "e2e-encryption",   # Olm/Megolm via vodozemac
    "sqlite",           # persistent SQLite state + crypto store
    "bundled-sqlite",   # compile SQLite in-tree (only a C compiler needed)
] }
# Same version as matrix-sdk (already in the tree). Only used to name the crypto
# policy types the builder accepts — CollectStrategy / DecryptionSettings /
# TrustRequirement live in matrix_sdk_base::crypto and aren't re-exported by matrix-sdk.
matrix-sdk-base = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "io-std", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 2
lto = "thin"
